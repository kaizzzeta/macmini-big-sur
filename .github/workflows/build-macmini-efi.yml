name: Construir EFI Macmini3,1 (desde fuente)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-macmini-efi.yml'

jobs:
  build-efi:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Obtener codigo fuente oficial de OCLP 2.5.1
        uses: actions/checkout@v4
        with:
          repository: dortania/OpenCore-Legacy-Patcher
          ref: 2.5.1
          path: oclp-src

      - name: Preparar Python para ejecutar OCLP desde fuente
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Instalar dependencias oficiales
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r oclp-src/requirements.txt

      - name: Instalar paquete oficial de OCLP para obtener payloads.dmg
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://github.com/dortania/OpenCore-Legacy-Patcher/releases/download/2.5.1/OpenCore-Patcher.pkg' \
            -o "$RUNNER_TEMP/OpenCore-Patcher.pkg"
          sudo installer -pkg "$RUNNER_TEMP/OpenCore-Patcher.pkg" -target /
          test -x '/Applications/OpenCore-Patcher.app/Contents/MacOS/OpenCore-Patcher'

      - name: Montar recursos oficiales de OCLP en la carpeta del codigo fuente
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$(find '/Applications/OpenCore-Patcher.app' -name payloads.dmg -type f -print -quit)"
          test -n "$IMAGE" || { echo 'ERROR: No se encontro payloads.dmg'; exit 1; }
          echo "Imagen de recursos: $IMAGE"
          mkdir -p "$GITHUB_WORKSPACE/oclp-src/payloads"
          hdiutil attach "$IMAGE" -nobrowse -noverify \
            -mountpoint "$GITHUB_WORKSPACE/oclp-src/payloads" \
            -shadow "$RUNNER_TEMP/oclp-payloads-shadow" \
            -passphrase password
          test -f "$GITHUB_WORKSPACE/oclp-src/payloads/Config/config.plist"
          test -f "$GITHUB_WORKSPACE/oclp-src/payloads/OpenCore/OpenCore-RELEASE.zip"

      - name: Construir OpenCore para Macmini3,1 sin directorio temporal
        shell: bash
        working-directory: oclp-src
        run: |
          set -euo pipefail
          python OpenCore-Patcher-GUI.command \
            --build --model Macmini3,1 --disable_sip --disable_smb --verbose
          BUILD="$PWD/Build-Folder/OpenCore-Build/EFI"
          echo "EFI creada en: $BUILD"
          test -s "$BUILD/OC/config.plist"
          test -s "$BUILD/OC/OpenCore.efi"
          test -s "$BUILD/BOOT/BOOTx64.efi"
          plutil -lint "$BUILD/OC/config.plist"
          mkdir -p "$GITHUB_WORKSPACE/resultado"
          ditto "$BUILD" "$GITHUB_WORKSPACE/resultado/EFI"
          test -s "$GITHUB_WORKSPACE/resultado/EFI/OC/config.plist"
          du -sh "$GITHUB_WORKSPACE/resultado/EFI"
          ls -lah "$GITHUB_WORKSPACE/resultado/EFI"

      - name: Publicar EFI descargable
        uses: actions/upload-artifact@v4
        with:
          name: EFI-Macmini3-1-BigSur
          path: resultado/EFI/
          if-no-files-found: error
          retention-days: 7
